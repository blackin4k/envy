[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-cli"
version = "0.1.0"
description = "Automatic Python virtual environment switching"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
envy = "envy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
